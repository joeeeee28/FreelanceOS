services:
  - type: web
    name: freelanceos
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: AUTH_SECRET
        sync: false

      - key: APP_URL
        sync: false
